{% extends "base.html" %}
{% block title %}{{ item.title }} | Sahu Tours & Travels{% endblock %}
{% block content %}
<section class="detail-hero"><div class="detail-image" style="{% if item.image %}background-image:url('{{ item.image }}'){% endif %}"></div><div class="detail-copy"><span class="eyebrow">{{ item.category }}</span><h1>{{ item.title }}</h1><p>{{ item.description }}</p><div class="detail-meta"><span>Duration <b>{{ item.duration }}</b></span><span>Price <b>{{ item.price }}</b></span></div><a class="btn btn-primary" href="{{ url_for('booking') }}">Enquire Now →</a></div></section>
{% endblock %}
