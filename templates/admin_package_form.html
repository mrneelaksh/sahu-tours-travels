{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} Package{% endblock %}
{% block content %}
<section class="form-section"><div class="form-title"><span class="eyebrow">ADMIN</span><h1>{{ 'Edit' if item else 'Add' }} <em>Package</em></h1></div><form class="big-form" method="post"><div class="form-row"><label>Title<input name="title" required value="{{ item.title if item else '' }}"></label><label>Category<input name="category" value="{{ item.category if item else 'Tour Package' }}"></label></div><div class="form-row"><label>Duration<input name="duration" value="{{ item.duration if item else 'Custom' }}"></label><label>Price<input name="price" value="{{ item.price if item else 'On Request' }}"></label></div><label>Image URL<input name="image" value="{{ item.image if item else '' }}" placeholder="Optional image URL"></label><label>Description<textarea name="description" rows="6">{{ item.description if item else '' }}</textarea></label><label class="check"><input type="checkbox" name="featured" {% if item and item.featured %}checked{% endif %}> Show on homepage</label><button class="btn btn-primary">Save Package →</button></form></section>
{% endblock %}
