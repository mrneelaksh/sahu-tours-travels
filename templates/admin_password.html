{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<section class="admin-login"><div class="admin-box"><span class="eyebrow">SECURITY</span><h1>Change <em>Password</em></h1><form method="post"><label>Current password<input type="password" name="old_password" required></label><label>New password<input type="password" name="new_password" required minlength="6"></label><label>Confirm new password<input type="password" name="confirm_password" required minlength="6"></label><button class="btn btn-dark">Update Password →</button></form><a href="{{ url_for('admin_dashboard') }}">← Back to dashboard</a></div></section>
{% endblock %}
